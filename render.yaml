# ============================================================================
# NEXORA — Render Blueprint (native Python runtimes; no Docker).
#
#   Vercel static frontend
#      │  HTTPS / WSS  (API_BASE_URL -> nexora-f397.onrender.com)
#      ▼
#   nexora-backend — public Django/Channels ASGI service
#      ├── external managed MySQL 8
#      ├── external managed Redis (REDIS_URL)
#      └── private S3-compatible object storage
#
# The backend is a normal public Render Web Service. There is no proxy, no
# relay and no extra authentication layer in front of it; Render's reverse
# proxy terminates TLS and forwards the real client to the ASGI workers.
# Set ALLOWED_HOSTS on the backend to its own Render hostname plus any custom
# API alias. External DB/Redis/storage/push secrets remain dashboard-managed.
# ============================================================================

services:
  # ------------------------------------------------------------ public API ---
  - type: web
    name: nexora-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: ./bin/render-build.sh
    # MUST be config.asgi (ASGI); Channels/WebSockets are required.
    startCommand: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker -c gunicorn.conf.py
    healthCheckPath: /health/live/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://nexora-eight-lilac.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://nexora-eight-lilac.vercel.app
      # Cross-site frontend (Vercel) → auth cookies must be None + Secure.
      - key: COOKIE_SAMESITE
        value: None
      - key: COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: MEDIA_PROCESS_INLINE
        value: "False"
      # FFmpeg is installed into ./bin by the native Python build script.
      - key: FFMPEG_BINARY
        value: /opt/render/project/src/backend/bin/ffmpeg
      - key: FFPROBE_BINARY
        value: /opt/render/project/src/backend/bin/ffprobe
      # ---- secrets / external services: set these in the dashboard ----
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL          # mysql://user:pass@host:3306/dbname
        sync: false
      - key: REDIS_URL             # redis:// or rediss:// from the managed provider
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: PUSH_PUBLIC_KEY
        sync: false
      - key: PUSH_PRIVATE_KEY
        sync: false
      - key: PUSH_CONTACT
        sync: false

  # -------------------------------------------------------------- workers ---
  # Workers remain separate, preserving the existing async jobs architecture.
  - type: worker
    name: nexora-push-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: ./bin/render-build.sh --no-migrate
    startCommand: python manage.py push_worker
    envVars: &worker_env
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: https://nexora-eight-lilac.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://nexora-eight-lilac.vercel.app
      - key: COOKIE_SAMESITE
        value: None
      - key: COOKIE_SECURE
        value: "True"
      - key: FFMPEG_BINARY
        value: /opt/render/project/src/backend/bin/ffmpeg
      - key: FFPROBE_BINARY
        value: /opt/render/project/src/backend/bin/ffprobe
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: PUSH_PUBLIC_KEY
        sync: false
      - key: PUSH_PRIVATE_KEY
        sync: false
      - key: PUSH_CONTACT
        sync: false

  - type: worker
    name: nexora-media-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: ./bin/render-build.sh --no-migrate
    startCommand: python manage.py media_worker
    envVars: *worker_env

  - type: worker
    name: nexora-upload-finalizer
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: ./bin/render-build.sh --no-migrate
    startCommand: python manage.py finalize_uploads
    envVars: *worker_env