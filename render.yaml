# ============================================================================
# NEXORA — Render Blueprint (native Python runtimes; no Docker).
#
#   Vercel static frontend
#      HTTPS / WSS
#          │
#          ▼
#   nexora-security-relay (public ASGI reverse proxy)
#          │ private network + shared hop token
#          ▼
#   nexora-backend (private Django/Channels ASGI service)
#      ├── external managed MySQL 8
#      ├── external managed Redis (REDIS_URL)
#      └── private S3-compatible object storage
#
# The relay is the only public API/WebSocket service. The backend is private.
# Set ALLOWED_HOSTS on the backend to the exact public hostname shown in the
# relay's Render dashboard (plus any custom API hostname). The relay obtains
# its default public hostname from RENDER_EXTERNAL_HOSTNAME automatically.
# The shared SECURITY_RELAY_TOKEN is generated once in an environment group.
# External DB/Redis/storage/push secrets remain dashboard-managed.
# ============================================================================

envVarGroups:
  - name: nexora-security-boundary
    envVars:
      - key: SECURITY_RELAY_TOKEN
        generateValue: true

services:
  # ------------------------------------------------------------ private API ---
  - type: pserv
    name: nexora-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: ./bin/render-build.sh
    # MUST be config.asgi (ASGI); Channels/WebSockets are required.
    startCommand: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker -c gunicorn.conf.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ALLOWED_HOSTS
        sync: false
      - key: SECURITY_RELAY_REQUIRED
        value: "True"
      - fromGroup: nexora-security-boundary
      - key: CORS_ALLOWED_ORIGINS
        value: https://nexora-eight-lilac.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://nexora-eight-lilac.vercel.app
      # Cross-site frontend (Vercel) → auth cookies must be None + Secure.
      - key: COOKIE_SAMESITE
        value: None
      - key: COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: MEDIA_PROCESS_INLINE
        value: "False"
      # FFmpeg is installed into ./bin by the native Python build script.
      - key: FFMPEG_BINARY
        value: /opt/render/project/src/backend/bin/ffmpeg
      - key: FFPROBE_BINARY
        value: /opt/render/project/src/backend/bin/ffprobe
      # ---- secrets / external services: set these in the dashboard ----
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL          # mysql://user:pass@host:3306/dbname
        sync: false
      - key: REDIS_URL             # redis:// or rediss:// from the managed provider
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: PUSH_PUBLIC_KEY
        sync: false
      - key: PUSH_PRIVATE_KEY
        sync: false
      - key: PUSH_CONTACT
        sync: false

  # ------------------------------------------------------------- public relay ---
  - type: web
    name: nexora-security-relay
    runtime: python
    rootDir: relay
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:application --host 0.0.0.0 --port ${PORT:-10000} --no-proxy-headers --no-server-header
    healthCheckPath: /health/live/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - fromGroup: nexora-security-boundary
      - key: UPSTREAM_HOST
        fromService:
          name: nexora-backend
          type: pserv
          property: host
      - key: UPSTREAM_PORT
        fromService:
          name: nexora-backend
          type: pserv
          property: port
      - key: UPSTREAM_SCHEME
        value: http
      - key: PUBLIC_SCHEME
        value: https
      - key: MAX_BODY_BYTES
        value: "2164260864"

  # -------------------------------------------------------------- workers ---
  # Workers remain separate, preserving the existing async jobs architecture.
  - type: worker
    name: nexora-push-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: ./bin/render-build.sh --no-migrate
    startCommand: python manage.py push_worker
    envVars: &worker_env
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECURITY_RELAY_REQUIRED
        value: "True"
      - fromGroup: nexora-security-boundary
      - key: CORS_ALLOWED_ORIGINS
        value: https://nexora-eight-lilac.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://nexora-eight-lilac.vercel.app
      - key: COOKIE_SAMESITE
        value: None
      - key: COOKIE_SECURE
        value: "True"
      - key: FFMPEG_BINARY
        value: /opt/render/project/src/backend/bin/ffmpeg
      - key: FFPROBE_BINARY
        value: /opt/render/project/src/backend/bin/ffprobe
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: PUSH_PUBLIC_KEY
        sync: false
      - key: PUSH_PRIVATE_KEY
        sync: false
      - key: PUSH_CONTACT
        sync: false

  - type: worker
    name: nexora-media-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: ./bin/render-build.sh --no-migrate
    startCommand: python manage.py media_worker
    envVars: *worker_env

  - type: worker
    name: nexora-upload-finalizer
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: ./bin/render-build.sh --no-migrate
    startCommand: python manage.py finalize_uploads
    envVars: *worker_env
