# ============================================================================
# NEXORA — Render blueprint (no Docker anywhere in this project).
#
#   Vercel static frontend
#        │  HTTPS / WSS
#        ▼
#   Render Python web service  →  Gunicorn + UvicornWorker + Django Channels
#        ├── external managed MySQL 8
#        ├── external managed Redis        (REDIS_URL)
#        └── external private S3-compatible bucket
#
# Every secret is declared with `sync: false`: Render prompts for the value and
# stores it in the service environment. Nothing secret is ever committed here.
#
# Apply with the Render dashboard ("New → Blueprint") or keep using the existing
# services and simply mirror the build/start commands and environment below.
# ============================================================================

services:
  # ---------------------------------------------------------------- web ----
  - type: web
    name: nexora-backend
    runtime: python
    rootDir: backend
    plan: starter
    healthCheckPath: /health/ready/
    buildCommand: ./bin/render-build.sh
    # MUST be config.asgi (ASGI). config.wsgi cannot serve WebSockets.
    startCommand: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker -c gunicorn.conf.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ALLOWED_HOSTS
        value: nexora-f397.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://nexora-eight-lilac.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://nexora-eight-lilac.vercel.app
      # Cross-site frontend (Vercel) → the auth cookies must be None + Secure.
      - key: COOKIE_SAMESITE
        value: None
      - key: COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: MEDIA_PROCESS_INLINE
        value: "False"
      # FFmpeg is installed into ./bin by the build script (see render-build.sh).
      - key: FFMPEG_BINARY
        value: /opt/render/project/src/backend/bin/ffmpeg
      - key: FFPROBE_BINARY
        value: /opt/render/project/src/backend/bin/ffprobe
      # ---- secrets / external services: set these in the dashboard ----
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL          # mysql://user:pass@host:3306/dbname
        sync: false
      - key: REDIS_URL             # redis:// or rediss:// from the managed provider
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: PUSH_PUBLIC_KEY
        sync: false
      - key: PUSH_PRIVATE_KEY
        sync: false
      - key: PUSH_CONTACT
        sync: false

  # ------------------------------------------------------------- workers ---
  # Background processing must NOT run inside the web service: a web dyno is
  # restarted on every deploy and scaled per request. These are separate Render
  # background workers sharing the same code, database, Redis and bucket.
  - type: worker
    name: nexora-push-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: ./bin/render-build.sh --no-migrate
    startCommand: python manage.py push_worker
    envVars: &worker_env
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: nexora-f397.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://nexora-eight-lilac.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://nexora-eight-lilac.vercel.app
      - key: COOKIE_SAMESITE
        value: None
      - key: COOKIE_SECURE
        value: "True"
      - key: FFMPEG_BINARY
        value: /opt/render/project/src/backend/bin/ffmpeg
      - key: FFPROBE_BINARY
        value: /opt/render/project/src/backend/bin/ffprobe
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: PUSH_PUBLIC_KEY
        sync: false
      - key: PUSH_PRIVATE_KEY
        sync: false
      - key: PUSH_CONTACT
        sync: false

  - type: worker
    name: nexora-media-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: ./bin/render-build.sh --no-migrate
    startCommand: python manage.py media_worker
    envVars: *worker_env

  - type: worker
    name: nexora-upload-finalizer
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: ./bin/render-build.sh --no-migrate
    startCommand: python manage.py finalize_uploads
    envVars: *worker_env
