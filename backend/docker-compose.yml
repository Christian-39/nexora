services:
  api:
    build: .
    env_file: .env
    command: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker -c gunicorn.conf.py
    ports: ["8000:8000"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  push-worker:
    build: .
    env_file: .env
    command: python manage.py push_worker
    depends_on: [mysql, redis]
    restart: unless-stopped
  upload-finalizer:
    build: .
    env_file: .env
    command: python manage.py finalize_uploads
    depends_on: [mysql, redis]
    restart: unless-stopped
  media-worker:
    build: .
    env_file: .env
    command: python manage.py media_worker
    depends_on: [mysql, redis]
    restart: unless-stopped
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes: ["mysql-data:/var/lib/mysql"]
    command: ["mysqld","--character-set-server=utf8mb4","--collation-server=utf8mb4_0900_ai_ci"]
    healthcheck: {test: ["CMD","mysqladmin","ping","-h","localhost"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server","--appendonly","yes","--requirepass","${REDIS_PASSWORD}"]
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD-SHELL","redis-cli -a $$REDIS_PASSWORD ping | grep PONG"], interval: 10s, timeout: 5s, retries: 10}
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    restart: unless-stopped
volumes:
  mysql-data:
  redis-data:
