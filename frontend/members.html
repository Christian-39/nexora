<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">

  <meta name="nexora-api-base" content="">
  <meta name="nexora-api-prefix" content="/api">
  <meta name="nexora-auth-mode" content="cookie">

  <title>Members</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="assets/images/icon-192.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="NEXORA">

  <script>
    (function () {
      try {
        var pref = JSON.parse(localStorage.getItem('nexora.theme') || '"system"');
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/themes.css">
  <link rel="stylesheet" href="assets/css/typography.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="app-body" data-page="members" data-page-title="Members">
  <a class="sr-only sr-only-focusable" href="#main-content">Skip to content</a>

  <div class="app-shell" id="app-shell">
    <nav class="app-nav" id="app-nav" aria-label="Primary"></nav>

    <div class="app-main">
      <div class="conn-banner" id="conn-banner"></div>

      <div class="page">
        <header class="page__header">
          <div>
            <h1 class="page__title">Members</h1>
            <div class="page__subtitle" id="member-count"></div>
          </div>
          <div class="page__actions">
            <button class="btn btn--primary btn--sm" id="create-member" type="button">Create member</button>
          </div>
        </header>

        <div class="page__body" id="main-content">
          <div class="container-wide">
            <div class="toolbar">
              <div class="search">
                <label class="sr-only" for="member-search">Search members by name or phone number</label>
                <input class="input" id="member-search" type="search" placeholder="Search name or phone number" autocomplete="off">
              </div>
              <div class="toolbar__group">
                <label class="sr-only" for="status-filter">Filter by account status</label>
                <select class="select" id="status-filter">
                  <option value="all">All statuses</option>
                  <option value="active">Active only</option>
                  <option value="inactive">Inactive only</option>
                </select>
              </div>
            </div>

            <div id="member-list" aria-live="polite" aria-busy="true"></div>
            <div class="pagination" id="member-pagination"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireSession } from './assets/js/auth.js';
    import { loadBranding } from './assets/js/theme.js';
    import { mountNavigation, mountConnectionBanner, mountSessionGuards } from './assets/js/navigation.js';
    import { realtime } from './assets/js/websocket.js';
    import { MembersController } from './assets/js/members.js';
    import { refreshUnread } from './assets/js/notifications.js';
    import { registerServiceWorker } from './assets/js/push.js';
    import { $ } from './assets/js/utils.js';

    loadBranding();

    (async () => {
      const user = await requireSession({ adminOnly: true });
      if (!user) return;

      mountNavigation({ active: 'members' });
      mountConnectionBanner();
      mountSessionGuards();
      registerServiceWorker();
      realtime.start('/ws/app/');
      refreshUnread();

      const controller = new MembersController({
        listEl: $('#member-list'),
        searchInput: $('#member-search'),
        statusFilter: $('#status-filter'),
        paginationEl: $('#member-pagination'),
        createBtn: $('#create-member'),
        countEl: $('#member-count'),
      });
      await controller.init();
      $('#member-list').setAttribute('aria-busy', 'false');
    })();
  </script>
</body>
</html>
