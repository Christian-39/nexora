<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">

  <meta name="nexora-api-base" content="">
  <meta name="nexora-api-prefix" content="/api">
  <meta name="nexora-auth-mode" content="cookie">

  <title>Groups</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="assets/images/icon-192.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="NEXORA">

  <script>
    (function () {
      try {
        var pref = JSON.parse(localStorage.getItem('nexora.theme') || '"system"');
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/themes.css">
  <link rel="stylesheet" href="assets/css/typography.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="app-body" data-page="groups" data-page-title="Groups">
  <a class="sr-only sr-only-focusable" href="#main-content">Skip to content</a>

  <div class="app-shell" id="app-shell">
    <nav class="app-nav" id="app-nav" aria-label="Primary"></nav>

    <div class="app-main">
      <div class="conn-banner" id="conn-banner"></div>

      <div class="page">
        <header class="page__header">
          <div>
            <h1 class="page__title">Groups</h1>
            <div class="page__subtitle" id="group-count"></div>
          </div>
          <div class="page__actions">
            <button class="btn btn--primary btn--sm" id="create-group" type="button" hidden>Create group</button>
          </div>
        </header>

        <div class="page__body" id="main-content">
          <div class="container-wide">
            <div class="toolbar">
              <div class="search">
                <label class="sr-only" for="group-search">Search groups</label>
                <input class="input" id="group-search" type="search" placeholder="Search groups" autocomplete="off">
              </div>
              <div class="toolbar__group" id="archived-wrap" hidden>
                <label class="check">
                  <input type="checkbox" id="archived-toggle">
                  <span class="check__text text-sm">Include archived</span>
                </label>
              </div>
            </div>

            <div id="group-list" aria-live="polite" aria-busy="true"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireSession, isAdmin } from './assets/js/auth.js';
    import { loadBranding } from './assets/js/theme.js';
    import { mountNavigation, mountConnectionBanner, mountSessionGuards } from './assets/js/navigation.js';
    import { realtime } from './assets/js/websocket.js';
    import { GroupsController } from './assets/js/groups.js';
    import { refreshUnread } from './assets/js/notifications.js';
    import { registerServiceWorker } from './assets/js/push.js';
    import { $ } from './assets/js/utils.js';

    loadBranding();

    // Shell first: paint the persistent app shell immediately (branding from
    // cache), then validate the session in the background so a cold backend
    // never blanks the sidebar/topbar.
    mountNavigation({ active: 'groups' });
    mountConnectionBanner();
    mountSessionGuards();

    (async () => {
      const user = await requireSession();
      if (!user) return;
      registerServiceWorker();
      realtime.start('/ws/app/');
      refreshUnread();

      // Admin-only affordances. The backend enforces the same rules.
      if (isAdmin()) {
        $('#create-group').hidden = false;
        $('#archived-wrap').hidden = false;
      }

      const controller = new GroupsController({
        listEl: $('#group-list'),
        searchInput: $('#group-search'),
        createBtn: $('#create-group'),
        archivedToggle: $('#archived-toggle'),
        countEl: $('#group-count'),
      });
      await controller.init();
      $('#group-list').setAttribute('aria-busy', 'false');
    })();
  </script>
</body>
</html>
