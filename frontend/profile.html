<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">

  <title>Profile</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="assets/images/icon-192.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="NEXORA">

  <script>
    (function () {
      try {
        var pref = JSON.parse(localStorage.getItem('nexora.theme') || '"system"');
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/themes.css">
  <link rel="stylesheet" href="assets/css/typography.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script id="nexora-config" type="application/json">{"API_BASE_URL":""}</script>
</head>
<body class="app-body" data-page="profile" data-page-title="Profile">
  <a class="sr-only sr-only-focusable" href="#main-content">Skip to content</a>

  <div class="app-shell" id="app-shell">
    <nav class="app-nav" id="app-nav" aria-label="Primary"></nav>

    <div class="app-main">
      <div class="conn-banner" id="conn-banner"></div>

      <div class="page">
        <header class="page__header">
          <h1 class="page__title">Profile</h1>
        </header>

        <div class="page__body" id="main-content">
          <div class="container-narrow">
            <div class="settings-layout">
              <nav class="settings-nav" id="settings-nav" aria-label="Profile sections"></nav>
              <div id="settings-panel"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireSession } from './assets/js/auth.js';
    import { loadBranding } from './assets/js/theme.js';
    import { mountNavigation, mountConnectionBanner, mountSessionGuards } from './assets/js/navigation.js';
    import { realtime } from './assets/js/websocket.js';
    import { SettingsController } from './assets/js/settings.js';
    import { refreshUnread } from './assets/js/notifications.js';
    import { registerServiceWorker } from './assets/js/push.js';
    import { $ } from './assets/js/utils.js';

    loadBranding();

    // Shell first: paint the persistent app shell immediately (branding from
    // cache), then validate the session in the background so a cold backend
    // never blanks the sidebar/topbar.
    mountNavigation({ active: 'profile' });
    mountConnectionBanner();
    mountSessionGuards();

    (async () => {
      const user = await requireSession();
      if (!user) return;
      registerServiceWorker();
      realtime.start('/ws/app/');
      refreshUnread();

      // The profile page shows the personal subset of the settings surface.
      const controller = new SettingsController({
        navEl: $('#settings-nav'),
        panelEl: $('#settings-panel'),
      });
      await controller.init();
      controller.sections = controller.sections.filter((s) =>
        ['profile', 'security', 'sessions', 'appearance', 'notifications'].includes(s.key)
      );
      controller.renderNav();
      controller.select('profile');
    })();
  </script>
</body>
</html>
